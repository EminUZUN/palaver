# Release on a version tag: git tag -s v0.1.0 -m v0.1.0 && git push origin v0.1.0
# No secrets are stored anywhere: npm uses trusted publishing (OIDC; configure it once on
# npmjs.com after the first manual `npm publish`), the relay image goes to ghcr.io with the
# built-in GITHUB_TOKEN, and the MCP Registry entry is published with GitHub OIDC.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # ghcr.io image
  id-token: write # npm trusted publishing and MCP Registry login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get install -y tmux
      - run: npm ci
      - run: npm test

      - name: Check that the tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./server.json").version')" = "$v"

      - name: Publish to npm (trusted publishing; skipped if this version is already published)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "palaver-agents@$v" version >/dev/null 2>&1; then
            echo "palaver-agents@$v is already on npm"
          else
            npm install -g npm@latest # trusted publishing needs npm 11.5.1+
            npm publish --access public
          fi

      - name: Publish the relay image to ghcr.io
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/palaver"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push --all-tags "$image"

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
