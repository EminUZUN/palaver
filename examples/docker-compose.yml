# Relay with per-member tokens. Put members.json next to this file, then:
# Replace 10.8.0.1 with the host's private or VPN address.
#   chmod 600 members.json && PALAVER_UID=$(id -u) PALAVER_BIND=10.8.0.1 docker compose up -d
# The relay runs as the file's owner, so it can read the private file.
services:
  palaver:
    build: ..
    restart: unless-stopped
    user: "${PALAVER_UID:-1000}"
    ports:
      # Publish on one private or VPN address; "7777:7777" publishes on all host addresses by default.
      - "${PALAVER_BIND:-127.0.0.1}:7777:7777" # e.g. PALAVER_BIND=10.8.0.1
    environment:
      PALAVER_MEMBERS: /run/secrets/members.json
    secrets:
      - members.json
secrets:
  members.json:
    file: ./members.json
